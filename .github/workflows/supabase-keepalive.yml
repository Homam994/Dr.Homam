name: Supabase Keep-Alive

on:
  schedule:
    # كل 3 أيام الساعة 10 صباحاً (UTC) = 1 مساءً بتوقيت السعودية
    - cron: '0 7 */3 * *'
  workflow_dispatch: # تشغيل يدوي من GitHub عند الحاجة

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/site_data?key=eq.data&select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}")

          echo "✅ Supabase response: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "🟢 قاعدة البيانات تعمل بشكل طبيعي"
          else
            echo "🔴 تحذير: الاستجابة غير متوقعة ($STATUS)"
            exit 1
          fi
